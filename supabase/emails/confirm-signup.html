<!DOCTYPE html>
<html lang="en">
  <body
    style="
      margin: 0;
      padding: 0;
      background: #f3ead8;
      font-family: Georgia, 'Times New Roman', Times, serif;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      style="background: #f3ead8"
    >
      <tr>
        <td align="center" style="padding: 40px 16px">
          <table
            role="presentation"
            width="480"
            cellspacing="0"
            cellpadding="0"
            style="
              max-width: 480px;
              background: #1a1210;
              color: #f3ead8;
              border: 1px solid #c6a35a;
            "
          >
            <tr>
              <td style="padding: 40px 32px; text-align: center">
                <p
                  style="
                    margin: 0 0 8px;
                    font-size: 28px;
                    letter-spacing: 0.04em;
                    color: #f3ead8;
                  "
                >
                  The Parlor
                </p>
                <p
                  style="
                    margin: 0 0 28px;
                    font-size: 12px;
                    letter-spacing: 0.16em;
                    color: #b7a894;
                  "
                >
                  Coleman Johns · Middle Tennessee
                </p>
                <p
                  style="
                    margin: 0 0 24px;
                    font-size: 16px;
                    line-height: 1.55;
                    color: #f3ead8;
                  "
                >
                  Confirm the name, if you please. The book will not take it
                  until this letter is opened.
                </p>
                <p style="margin: 0 0 32px">
                  <a
                    href="{{ .ConfirmationURL }}"
                    style="
                      display: inline-block;
                      border: 1px solid #c6a35a;
                      color: #c6a35a;
                      text-decoration: none;
                      padding: 12px 22px;
                      letter-spacing: 0.14em;
                      font-size: 13px;
                    "
                    >Open the letter</a
                  >
                </p>
                <p style="margin: 0; font-size: 11px; color: #b7a894">
                  The Parlor is a Coleman Johns parlor game. Not a listing.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
